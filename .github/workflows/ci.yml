name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Runs every command the lessons show in a fresh copy of the course container
  # and fails if any of them no longer prints what the lesson says it prints.
  transcripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the course container
        run: docker compose -f docker/compose.yaml build
      - name: Every recorded command still prints the same
        run: node site/scripts/transcripts.mjs check
